{% extends "base.html" %}
{% block title %}Acceso · Locutor{% endblock %}
{% block body %}
<div class="login-wrap">
  <div class="brand-big">🎙️ Locutor</div>
  <div class="panel">
    {% if error %}<p class="error" style="margin-top:0">{{ error }}</p>{% endif %}
    <form method="post" action="/login" autocomplete="off">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label>Usuario
        <input type="text" name="username" required maxlength="64" autofocus>
      </label>
      <label>Contraseña
        <input type="password" name="password" required maxlength="256">
      </label>
      <button type="submit" class="btn">Entrar</button>
    </form>
  </div>
</div>
{% endblock %}
